<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Begus - Catálogo Online</title>
    <link rel="stylesheet" href="style.css">
    <meta property="og:title" content="Begus - Catálogo Online">
    <meta property="og:description" content="Explorá nuestros productos y hacé tu pedido por WhatsApp.">
    <meta property="og:type" content="website">
</head>
<body>

    <!-- Encabezado con Título "BEGUS" y Botón Admin -->
    <header class="navbar">
        <h1 class="brand-title">BEGUS</h1>
        <button id="btn-abrir-admin" class="btn-admin">🔑 Admin</button>
    </header>

    <!-- Catálogo de Productos -->
    <main class="container">
        <div id="loading-spinner" class="spinner-container">
            <div class="spinner"></div>
            <p id="texto-cargando">Cargando catálogo...</p>
        </div>

        <div id="grid-productos" class="product-grid"></div>
    </main>

    <!-- Botón Flotante del Carrito -->
    <div id="btn-carrito-flotante" class="cart-floating-btn">
        🛒 <span id="cart-count">0</span>
    </div>

    <!-- Modal del Carrito -->
    <div id="modal-carrito" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Tu Carrito</h2>
                <button id="btn-cerrar-carrito" class="btn-close">&times;</button>
            </div>
            <div id="cart-items" class="cart-items-list"></div>
            <div class="cart-footer">
                <p class="cart-total">Total: $<span id="cart-total-price">0</span></p>
                <button id="btn-enviar-pedido-wa" class="btn-wa-checkout">💬 Enviar Pedido por WhatsApp</button>
            </div>
        </div>
    </div>

    <!-- Panel de Administración Lateral -->
    <div id="panel-admin" class="admin-panel">
        <div class="panel-header">
            <h2>Agregar Producto</h2>
            <button type="button" id="btn-cerrar-admin" class="btn-close">&times;</button>
        </div>
        
        <form id="form-producto">
            <div class="form-group">
                <input type="file" id="input-imagen-file" accept="image/*" class="file-input" required>
                <label for="input-imagen-file" id="label-imagen" class="file-upload-label">📸 Seleccionar foto</label>
            </div>
            
            <div class="form-group">
                <input type="text" id="input-nombre" placeholder="Título del producto" required>
            </div>

            <div class="form-group">
                <input type="number" id="input-precio" placeholder="Precio ($)" step="0.01" required>
            </div>

            <button type="submit" id="btn-agregar-producto" class="btn-submit">Publicar Producto</button>
        </form>
    </div>

    <!-- SDKs Compatibles de Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
