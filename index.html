<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Begus</title>

    <!-- PWA y Manifest (Ref. imagen de archivos) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">

    <!-- Encabezado de Ciberseguridad CSP (Ref: Manual de Referencia Técnica - A03/XSS) -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self'; 
        script-src 'self' https://www.gstatic.com; 
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
        font-src 'self' https://fonts.gstatic.com; 
        img-src 'self' data: https:; 
        connect-src 'self' https://*.firebaseio.com https://*.googleapis.com;
    ">

    <!-- Estilo Principal Canónico -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado Principal -->
    <header class="main-header">
        <div class="logo-container">
            <h1>Begus</h1>
        </div>
        <button id="btn-abrir-admin" class="btn-primary">🔑 Admin</button>
    </header>

    <!-- Panel de Administración (Inyección de productos) -->
    <aside id="panel-admin" class="panel-admin">
        <h2>Gestión de Catálogo</h2>
        <form id="form-producto">
            <input type="text" id="input-nombre" placeholder="Nombre del producto" required autocomplete="off">
            <input type="number" id="input-precio" step="0.01" placeholder="Precio ($)" required autocomplete="off">
            <input type="url" id="input-imagen-url" placeholder="URL de la imagen (Ej: ImgBB / Drive)" required autocomplete="off">
            <button type="submit" class="btn-success">Guardar Producto</button>
        </form>
    </aside>

    <!-- Grilla Dinámica del Catálogo -->
    <main class="container">
        <section id="catalogo-productos" class="catalogo-grid">
            <!-- Renderizado dinámico desde app.js -->
        </section>
    </main>

    <!-- Registro del Service Worker para PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch(err => console.error('Error al registrar SW:', err));
            });
        }
    </script>

    <!-- Módulo JS Principal Canónico -->
    <script type="module" src="app.js"></script>
</body>
</html>
