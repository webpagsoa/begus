<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Begus</title>

    <!-- Encabezado de Seguridad CSP (Sección 1 - Manual de Referencia Técnica) -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self'; 
        script-src 'self' https://www.gstatic.com; 
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
        font-src 'self' https://fonts.gstatic.com; 
        img-src 'self' data: https:; 
        connect-src 'self' https://*.firebaseio.com https://*.googleapis.com;
    ">

    <!-- Normalización de la hoja de estilos principal -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Encabezado y Navegación Principal -->
    <header class="main-header">
        <div class="logo-container">
            <h1>Begus</h1>
        </div>
        <button id="btn-abrir-admin" class="btn-primary">🔑 Admin</button>
    </header>

    <!-- Modal / Panel de Administración -->
    <aside id="panel-admin" class="panel-admin">
        <h2>Gestión de Catálogo</h2>
        <form id="form-producto">
            <input type="text" id="input-nombre" placeholder="Nombre del producto" required>
            <input type="number" id="input-precio" step="0.01" placeholder="Precio ($)" required>
            <input type="url" id="input-imagen-url" placeholder="URL de la imagen (Ej: ImgBB / Drive)" required>
            <button type="submit" class="btn-success">Guardar Producto</button>
        </form>
    </aside>

    <!-- Grilla del Catálogo de Productos -->
    <main class="container">
        <section id="catalogo-productos" class="catalogo-grid">
            <!-- Los productos se renderizan dinámicamente desde app.js -->
        </section>
    </main>

    <!-- Importación canónica del script como módulo ES6 -->
    <script type="module" src="app.js"></script>
</body>
</html>
